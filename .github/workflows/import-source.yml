name: Import archived RIFT//STAR source
on:
  push:
    paths:
      - 'import/ready.txt'
      - '.github/workflows/import-source.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract checked source snapshot
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, io, pathlib, tarfile
          p = pathlib.Path('import/ready.txt')
          if not p.is_file():
              raise SystemExit('Import not requested yet')
          parts = sorted(pathlib.Path('import').glob('part-*.txt'))
          if len(parts) != 7:
              raise SystemExit(f'Expected 7 archive parts; found {len(parts)}')
          raw = base64.b64decode(''.join(part.read_text(encoding='ascii').strip() for part in parts), validate=True)
          import hashlib
          if hashlib.sha256(raw).hexdigest() != 'f7c121a165bf8b0e187b9a86c5867b633ac5fda1552ea204bee6321df2ee6ea4':
              raise SystemExit('Source archive digest mismatch')
          with tarfile.open(fileobj=io.BytesIO(raw), mode='r:xz') as tar:
              entries = tar.getmembers()
              for member in entries:
                  path = pathlib.PurePosixPath(member.name)
                  if (not member.isfile()) or path.is_absolute() or '..' in path.parts or path.parts[0] in ('.git', '.github', 'import'):
                      raise SystemExit('Unsafe archive entry: ' + member.name)
              for member in entries:
                  dest = pathlib.Path(member.name)
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  extracted = tar.extractfile(member)
                  if extracted is None:
                      raise SystemExit('Unreadable archive entry: ' + member.name)
                  dest.write_bytes(extracted.read())
          p.unlink()
          for part in parts:
              part.unlink()
          PY
      - name: Commit extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Import original Codex RIFT//STAR source, configs, and docs"
          git push
