name: Import verified original source snapshot

on:
  push:
    paths:
      - 'import/ready.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Decode, validate and import original source
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import io
          import lzma
          import pathlib
          import tarfile
          import urllib.request
          import zipfile

          parts = sorted(pathlib.Path('import').glob('part-*.txt'))
          if len(parts) != 6 or not pathlib.Path('import/ready.txt').is_file():
              raise SystemExit(f'Incomplete import: {len(parts)} / 6 parts')
          encoded = ''.join(part.read_text(encoding='ascii').strip() for part in parts)
          bundle = base64.b64decode(encoded, validate=True)
          expected = '80f95a6ec1083445928fea603e32545cad928abf4b052722bc40a6c0150e4595'
          if hashlib.sha256(bundle).hexdigest() != expected:
              raise SystemExit('Archive SHA-256 mismatch')
          raw = lzma.decompress(bundle)
          with tarfile.open(fileobj=io.BytesIO(raw), mode='r:') as archive:
              files = archive.getmembers()
              if len(files) != 45:
                  raise SystemExit(f'Unexpected import file count: {len(files)}')
              for item in files:
                  dest = pathlib.PurePosixPath(item.name)
                  if (
                      not item.isfile()
                      or dest.is_absolute()
                      or '..' in dest.parts
                      or dest.parts[0] in ('.git', '.github', 'import')
                  ):
                      raise SystemExit(f'Unsafe archive entry: {item.name}')
              for item in files:
                  output = pathlib.Path(item.name)
                  output.parent.mkdir(parents=True, exist_ok=True)
                  stream = archive.extractfile(item)
                  if stream is None:
                      raise SystemExit(f'Unreadable entry: {item.name}')
                  output.write_bytes(stream.read())
                  output.chmod(item.mode & 0o777)

          # Preserve exact Gradle wrapper from the official Forge MDK.
          url = 'https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.10/forge-1.20.1-47.4.10-mdk.zip'
          with urllib.request.urlopen(url, timeout=120) as response:
              mdk_data = response.read()
          if hashlib.sha256(mdk_data).hexdigest() != '73e0122becd05e39b47eced54e030380d66411850ed86786a2d58ecd886b0451':
              raise SystemExit('Forge MDK SHA-256 mismatch')
          with zipfile.ZipFile(io.BytesIO(mdk_data)) as mdk:
              wrapper = mdk.read('gradle/wrapper/gradle-wrapper.jar')
          if hashlib.sha256(wrapper).hexdigest() != 'ed2c26eba7cfb93cc2b7785d05e534f07b5b48b5e7fc941921cd098628abca58':
              raise SystemExit('Gradle wrapper SHA-256 mismatch')
          target = pathlib.Path('riftstar-companion/gradle/wrapper/gradle-wrapper.jar')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(wrapper)

          for part in parts:
              part.unlink()
          pathlib.Path('import/ready.txt').unlink()
          print('Verified source import complete: 46 original files')
          PY
      - name: Commit restored source on main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git rm -f .github/workflows/import-source.yml
          git diff --cached --quiet || git commit -m 'Import exact Codex source snapshot from uploaded ZIP'
          git push
