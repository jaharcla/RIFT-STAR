name: Import archived RIFT//STAR source
on:
  push:
    paths:
      - 'import/riftstar-source.tar.gz.b64'
      - '.github/workflows/import-source.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract checked source snapshot
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, io, pathlib, tarfile
          p = pathlib.Path('import/riftstar-source.tar.gz.b64')
          if not p.is_file():
              raise SystemExit('Missing source archive')
          raw = base64.b64decode(p.read_text(encoding='ascii').strip(), validate=True)
          with tarfile.open(fileobj=io.BytesIO(raw), mode='r:gz') as tar:
              entries = tar.getmembers()
              for member in entries:
                  path = pathlib.PurePosixPath(member.name)
                  if (not member.isfile()) or path.is_absolute() or '..' in path.parts or path.parts[0] in ('.git', '.github', 'import'):
                      raise SystemExit('Unsafe archive entry: ' + member.name)
              for member in entries:
                  dest = pathlib.Path(member.name)
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  extracted = tar.extractfile(member)
                  if extracted is None:
                      raise SystemExit('Unreadable archive entry: ' + member.name)
                  dest.write_bytes(extracted.read())
          p.unlink()
          PY
      - name: Commit extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Import original Codex RIFT//STAR source, configs, and docs"
          git push
