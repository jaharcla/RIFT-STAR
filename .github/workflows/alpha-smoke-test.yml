name: Alpha headless smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Python helper dependencies
        timeout-minutes: 5
        run: python -m pip install -r requirements.txt
      - name: Restore pinned dependencies
        timeout-minutes: 10
        run: python fetch_mods.py
      - name: Install Forge server runtime
        timeout-minutes: 5
        run: |
          python bootstrap_forge.py
          java -jar tools/forge-1.20.1-47.4.10-installer.jar --installServer server
          echo eula=true > server/eula.txt
      - name: Build companion and assemble server
        timeout-minutes: 10
        run: |
          python riftstar-companion/build_local.py
          python assemble_server.py
      - name: Run headless server smoke test
        timeout-minutes: 5
        shell: bash
        run: |
          set +e
          timeout --signal=TERM 90s bash -c 'cd server && ./run.sh --nogui' 2>&1 | tee server-smoke.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            exit "$status"
          fi
      - name: Build CurseForge package
        timeout-minutes: 5
        run: python package_alpha.py
      - name: Upload smoke-test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riftstar-alpha-smoke-test
          path: |
            server-smoke.log
            dist/RIFTSTAR-0.1.0-alpha.zip
            server/logs/**
            server/crash-reports/**
